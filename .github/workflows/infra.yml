name: infra

# Pipeline de infraestructura. Es dueno de la existencia y la configuracion
# de la funcion, y no toca la imagen.

on:
  pull_request:
    paths:
      - 'infra/**'
  push:
    branches:
      - main
    paths:
      - 'infra/**'
  workflow_dispatch:
    inputs:
      autorizar_destruccion:
        description: 'Autorizar destruccion o reemplazo de recursos'
        type: boolean
        default: false

jobs:

  # TODO
  # Verificar la sintaxis y la integridad del codigo de infraestructura:
  # formato, inicializacion contra el backend remoto y validacion.
  # Condicion de detencion: cualquiera de las tres comprobaciones falla.
  # La configuracion del backend no esta en el codigo: llega por archivo.
  # Sustituir el paso centinela por la implementacion.
  validar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - name: Credenciales temporales
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token:     ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false

      - name: Formato
        run: terraform fmt -check -recursive

      - name: Inicializar contra el backend remoto
        run: terraform init -backend-config=backend.hcl

      - name: Validar
        run: terraform validate

  # TODO
  # Analizar el codigo declarado contra politicas de infraestructura.
  #
  # Condicion de detencion: un hallazgo de severidad alta o critica, salvo
  # que este anotado como aceptado junto al recurso que lo origina, con
  # identificador, razon, responsable y fecha de vencimiento.
  #
  # infra/main.tf ya trae una de esas anotaciones, sobre un hallazgo de
  # severidad alta que no se puede corregir sin romper el diseno del pipeline
  # de aplicacion. Leerla: es la forma que tiene que tener cualquier excepcion
  # que ustedes agreguen. Y es el modo de comprobar que esta compuerta quedo
  # bien armada: si detiene igual, la esta ignorando.
  #
  # El vencimiento no es decorativo: pasada esa fecha el hallazgo vuelve a
  # contar y el pipeline se detiene solo.
  #
  # A diferencia de las compuertas del pipeline de aplicacion, esta detiene.
  # Preferir una action del marketplace antes que instalar la herramienta.
  # La guia del laboratorio lista las referencias disponibles.
  #
  # Sustituir el paso centinela por la implementacion.
  politicas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Analisis de politicas sobre el codigo declarado
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: infra
          severity: HIGH,CRITICAL
          exit-code: '1'
          format: table
          output: politicas.txt

      - name: Dejar el resultado visible
        if: always()
        run: |
          {
            echo '### Politicas · Trivy IaC sobre infra/'
            echo
            echo 'Detencion a partir de severidad HIGH.'
            echo
            if [ -s politicas.txt ]; then
              sed 's/^/    /' politicas.txt
            else
              echo 'Sin hallazgos HIGH o CRITICAL.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # TODO
  # Calcular el plan, guardarlo en disco y exportarlo a tfplan.json.
  # El plan que se aplica despues es el guardado aca, no uno recalculado.
  #
  # Sobre tfplan.json se implementan dos reglas. Las dos miran el efecto
  # calculado del cambio, no el codigo fuente. Un analisis del codigo no
  # puede responder si el plan destruye algo: eso depende del estado actual,
  # no de lo declarado.
  #
  # Regla 1 · Ninguna accion de destruccion sin autorizacion.
  #   El job falla si algun resource_change incluye la accion delete.
  #   Un reemplazo cuenta como destruccion: el recurso que existia deja de
  #   existir.
  #   La autorizacion es deliberadamente incomoda. No puede venir del codigo
  #   ni del propio plan, porque entonces la daria el mismo cambio que se
  #   quiere controlar. Tiene que ser un acto humano y explicito, fuera del
  #   disparo automatico.
  #
  # Regla 2 · El plan se publica en el pull request, en texto legible, para
  #   que quien revisa vea la diferencia exacta antes de aprobar. Esta regla
  #   no detiene: informa. Conviene que corra antes que la regla 1, para que
  #   el plan quede visible aunque la compuerta detenga.
  #
  # Condicion de detencion: regla 1 incumplida. Esta compuerta detiene, y
  # con ella el job aplicar no llega a ejecutarse.
  #
  # Sustituir el paso centinela por la implementacion.
  plan:
    needs: [validar, politicas]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - name: Credenciales temporales
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token:     ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false

      - name: Inicializar contra el backend remoto
        run: terraform init -backend-config=backend.hcl

      - name: Calcular el plan y exportarlo
        run: |
          terraform plan -input=false -out=tfplan
          terraform show -json tfplan > tfplan.json
          terraform show -no-color tfplan > tfplan.txt

      - name: Regla 2 · Publicar el plan en el pull request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let plan = fs.readFileSync('infra/tfplan.txt', 'utf8');
            if (plan.length > 60000) {
              plan = plan.slice(0, 60000) + '\n... (truncado)';
            }
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '## Plan de Terraform\n\n<details><summary>Ver el plan completo</summary>\n\n<pre>' +
                    plan.replace(/&/g, '&amp;').replace(/</g, '&lt;') +
                    '</pre>\n\n</details>'
            });

      - name: Regla 1 · Ninguna destruccion sin autorizacion
        env:
          AUTORIZADO: ${{ github.event_name == 'workflow_dispatch' && inputs.autorizar_destruccion }}
        run: |
          destrucciones=$(jq -r '[.resource_changes[]? | select(.change.actions | index("delete")) | .address] | join("\n")' tfplan.json)

          {
            echo '### Compuerta del plan'
            echo
            if [ -z "$destrucciones" ]; then
              echo 'El plan no destruye ni reemplaza ningun recurso.'
            else
              echo 'Recursos que el plan destruye o reemplaza:'
              echo
              echo "$destrucciones" | sed 's/^/    /'
              echo
              echo "Autorizacion humana explicita: ${AUTORIZADO}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -n "$destrucciones" ] && [ "$AUTORIZADO" != "true" ]; then
            echo "::error::El plan destruye o reemplaza recursos y no hay autorizacion explicita."
            exit 1
          fi

      - name: Guardar el plan para el apply
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: infra/tfplan
          if-no-files-found: error

  # TODO
  # Aplicar el plan que produjo el job anterior, sin recalcularlo.
  # Corre solo desde la rama principal y solo si la compuerta del plan paso.
  # Condicion de detencion: el apply falla.
  # Sustituir el paso centinela por la implementacion.
  aplicar:
    needs: plan
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - name: Credenciales temporales
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token:     ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false

      - name: Recuperar el plan calculado
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: infra

      - name: Inicializar contra el backend remoto
        run: terraform init -input=false -reconfigure -backend-config=backend.hcl

      - name: Aplicar el plan guardado
        run: terraform apply -input=false tfplan
